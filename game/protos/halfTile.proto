#VRML_SIM R2025a utf8

EXTERNPROTO "worldTile.proto"

PROTO halfTile [
      field SFInt32 xPos 0
      field SFInt32 zPos 0
	  field SFString id ""
	  field SFFloat xScale 1.0
	  field SFFloat zScale 1.0
	  field SFFloat yScale 1.0
		field SFInt32 rightWall 0
		field SFInt32 bottomWall 0
		field SFInt32 topWall 0
		field SFInt32 leftWall 0
      field MFInt32 tile1Walls [0, 0, 0, 0]
      field MFInt32 tile2Walls [0, 0, 0, 0]
      field MFInt32 tile3Walls [0, 0, 0, 0]
      field MFInt32 tile4Walls [0, 0, 0, 0]
      
      field MFBool tile1External [FALSE, FALSE, FALSE, FALSE]
      field MFBool tile2External [FALSE, FALSE, FALSE, FALSE]
      field MFBool tile3External [FALSE, FALSE, FALSE, FALSE]
      field MFBool tile4External [FALSE, FALSE, FALSE, FALSE]
      field SFFloat width 0.0
	  field SFFloat height 0.0 
      field SFBool floor FALSE
      field SFBool start FALSE
	  field SFBool trap FALSE
	  field SFBool checkpoint FALSE
	  field SFBool swamp FALSE
	  field SFBool contact FALSE
    field MFInt32 curve [0, 0, 0, 0]
    field SFColor tileColor 0 0 0
		field SFInt32 room 0
]
{
DEF TILE Pose {

	  %<
    const scaleX = fields.xScale.value;
    const scaleY = fields.yScale.value;
    const scaleZ = fields.zScale.value;
    const xStart = -(fields.width.value * (0.3 * scaleX) / 2.0);
    const zStart = -(fields.height.value * (0.3 * scaleZ) / 2.0);
    const x = fields.xPos.value * (0.3 * scaleX) + xStart;
    const z = fields.zPos.value * (0.3 * scaleZ) + zStart;
  >%

  translation %<= x >% 0 %<= z >%

      children[
          DEF TILE worldTile {
            xScale %<= scaleX >%
            yScale %<= scaleY >%
            zScale %<= scaleZ >%
            xPos 0 
            zPos 0  
            topWall IS topWall
						rightWall IS rightWall
						bottomWall IS bottomWall
						leftWall IS leftWall
            floor %<= fields.floor.value ? "TRUE" : "FALSE" >% # ternary operator!
            trap %<= fields.trap.value ? "TRUE" : "FALSE" >%
            start %<= fields.start.value ? "TRUE" : "FALSE" >%
            checkpoint %<= fields.checkpoint.value ? "TRUE" : "FALSE" >%
            swamp %<= fields.swamp.value ? "TRUE" : "FALSE" >%
            contact %<= fields.contact.value ? "TRUE" : "FALSE" >%
            id %<= "\"" + fields.id.value + ".0" + "\"" >%
            tileColor IS tileColor
            topExternal %<= (fields.tile1External.value[0] && fields.tile2External.value[0]) ? "TRUE" : "FALSE" >%
            rightExternal %<= (fields.tile2External.value[1] && fields.tile4External.value[1]) ? "TRUE" : "FALSE" >%
            bottomExternal %<= (fields.tile3External.value[2] && fields.tile4External.value[2]) ? "TRUE" : "FALSE" >%
            leftExternal %<= (fields.tile1External.value[3] && fields.tile3External.value[3]) ? "TRUE" : "FALSE" >%
          }
          DEF TILE worldTile {
            xPos 0 
            zPos 0 
            xScale %<= scaleX * 0.5 >%
            yScale %<= scaleY * 0.5 >%
            zScale %<= scaleZ * 0.5 >%
            width 1 
            height 1
            topWall %<= fields.tile1Walls.value[0] >%
            rightWall %<= fields.tile1Walls.value[1] >%
            bottomWall %<= fields.tile1Walls.value[2] >%
            leftWall %<= fields.tile1Walls.value[3] >%
            topExternal %<= fields.tile1External.value[0] ? "TRUE" : "FALSE" >%
            rightExternal %<= fields.tile1External.value[1] ? "TRUE" : "FALSE" >%
            bottomExternal %<= fields.tile1External.value[2] ? "TRUE" : "FALSE" >%
            leftExternal %<= fields.tile1External.value[3] ? "TRUE" : "FALSE" >%
            id %<= "\"" + fields.id.value + ".1" + "\"" >%
            isHalf TRUE
            curveDir %<= fields.curve.value[0] >% 
          }
          DEF TILE worldTile {
            xPos 1
            zPos 0
            xScale %<= scaleX * 0.5 >%
            yScale %<= scaleY * 0.5 >%
            zScale %<= scaleZ * 0.5 >% 
            width 1
            height 1
            topWall %<= fields.tile2Walls.value[0] >%
            rightWall %<= fields.tile2Walls.value[1] >%
            bottomWall %<= fields.tile2Walls.value[2] >%
            leftWall %<= fields.tile2Walls.value[3] >%
            topExternal %<= fields.tile2External.value[0] ? "TRUE" : "FALSE" >%
            rightExternal %<= fields.tile2External.value[1] ? "TRUE" : "FALSE" >%
            bottomExternal %<= fields.tile2External.value[2] ? "TRUE" : "FALSE" >%
            leftExternal %<= fields.tile2External.value[3] ? "TRUE" : "FALSE" >%
            id %<= "\"" + fields.id.value + ".2" + "\"" >%
            isHalf TRUE
            curveDir %<= fields.curve.value[1] >% 
              
          }
          DEF TILE worldTile {
            xPos 0 
            zPos 1
            xScale %<= scaleX * 0.5 >%
            yScale %<= scaleY * 0.5 >%
            zScale %<= scaleZ * 0.5 >% 
            width 1
            height 1
            topWall %<= fields.tile3Walls.value[0] >%
            rightWall %<= fields.tile3Walls.value[1] >%
            bottomWall %<= fields.tile3Walls.value[2] >%
            leftWall %<= fields.tile3Walls.value[3] >%
            topExternal %<= fields.tile3External.value[0] ? "TRUE" : "FALSE" >%
            rightExternal %<= fields.tile3External.value[1] ? "TRUE" : "FALSE" >%
            bottomExternal %<= fields.tile3External.value[2] ? "TRUE" : "FALSE" >%
            leftExternal %<= fields.tile3External.value[3] ? "TRUE" : "FALSE" >%
            id %<= "\"" + fields.id.value + ".3" + "\"" >%
            isHalf TRUE
            curveDir %<= fields.curve.value[2] >% 
              
          }
          DEF TILE worldTile {
            xPos 1
            zPos 1
            xScale %<= scaleX * 0.5 >%
            yScale %<= scaleY * 0.5 >%
            zScale %<= scaleZ * 0.5 >%
            width 1
            height 1
            topWall %<= fields.tile4Walls.value[0] >%
            rightWall %<= fields.tile4Walls.value[1] >%
            bottomWall %<= fields.tile4Walls.value[2] >%
            leftWall %<= fields.tile4Walls.value[3] >%
            topExternal %<= fields.tile4External.value[0] ? "TRUE" : "FALSE" >%
            rightExternal %<= fields.tile4External.value[1] ? "TRUE" : "FALSE" >%
            bottomExternal %<= fields.tile4External.value[2] ? "TRUE" : "FALSE" >%
            leftExternal %<= fields.tile4External.value[3] ? "TRUE" : "FALSE" >%
            id %<= "\"" + fields.id.value + ".4" + "\"" >%
            isHalf TRUE
            curveDir %<= fields.curve.value[3] >% 
              
          }
      ]
      }
}
