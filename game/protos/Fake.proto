#VRML_SIM R2025a utf8

# tags: static
PROTO Fake [
	field SFVec3f    translation       0 0 0
	field SFRotation rotation          0 0 0 0
	field SFString   name              "Fake"
	field SFString   type              "omega"
	field SFInt32    scoreWorth        10
]
{
	%<
		let filename = "";
		if (fields.type.value === "omega") {
			filename = "./stl/U.stl";
		} else if (fields.type.value === "phi") {
			filename = "./stl/S.stl";
		} else if (fields.type.value === "psi") {
			filename = "./stl/H.stl";
		}
	>%

	Pose {
		translation IS translation
		rotation IS rotation
		children [
			Solid {
				translation 0.0 0.0 0
				rotation 0 1 0 3.14159
				children [
					Solid {
						translation 0 0 0
						children [
							Shape {
								appearance PBRAppearance {
									metalness 0
									emissiveColor 1 1 1
								}
								geometry Box {
									size 0.016 0.016 0.0002
								}
							}
						]
					}
					Transform {
						scale 0.0008 0.0008 0.0008
						translation 0 0 0
						children [
							Shape {
								appearance PBRAppearance {
									IBLStrength 0
									emissiveIntensity 0
								}
								geometry Mesh {
									url [ "%<= filename >%" ]
								}
							}
						]
					}
				]
				name IS name
				
			}
		]
	}
	
}

