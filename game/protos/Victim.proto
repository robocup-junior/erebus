#VRML_SIM R2025a utf8

# tags: static
PROTO Victim [
    field SFVec3f    translation       0 0 0
    field SFRotation rotation          0 0 0 0
    field SFBool     found             FALSE
    field SFString   name              "Victim"
    field SFString   type              "harmed"
    field SFInt32    scoreWorth        10
]
{
    %<
      let filename = "./textures/victim_harmed_not_found.png";
      if (fields.type.value === "harmed") {
        filename = fields.found.value
          ? "./textures/victim_harmed_found.png"
          : "./textures/victim_harmed_not_found.png";
      } else if (fields.type.value === "unharmed") {
        filename = fields.found.value
          ? "./textures/victim_unharmed_found.png"
          : "./textures/victim_unharmed_not_found.png";
      } else if (fields.type.value === "stable") {
        filename = fields.found.value
          ? "./textures/victim_stable_found.png"
          : "./textures/victim_stable_not_found.png";
      }
    >%
    Pose {
        translation IS translation
        rotation IS rotation
        children [
            Solid {
                translation 0 0 0
                rotation 0 0.707105 0.707108 3.14159
                children [
                    Shape {
                        appearance Appearance {
                            texture DEF human0texture ImageTexture {
                                url [ "%<= filename >%" ]
                                filtering 0
                            }
                        }
                        geometry DEF VICTIMPLANE Box {
                            size 0.016 0.0001 0.016
                        }
                        isPickable FALSE
                    }
                ]
                name IS name
            }
        ]
    }
}
